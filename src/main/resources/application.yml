spring:
  application:
    name: ai-aigent
  Profiles:
    active: local
  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 10000
    mcp:
      client:
        sse:
          connections:
            server1:
              url: http://localhost:8124
server:
  port: 8080
  servlet:
    context-path: /api
# springdoc-openapi ??????
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: "default"
      paths-to-match: "/**"
      packages-to-scan: com.xiaoyu.aiaigent.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# 修改日志级别，查看更多细节
logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug

# 多租户隔离 + JWT 登录
lorekeeper:
  jwt:
    secret: ${LOREKEEPER_JWT_SECRET:LoreKeeper-Dev-Secret-Key-2026}
    expire-ms: 604800000
  mcp:
    database-url: http://localhost:8125
    notify-url: http://localhost:8126

rag:
  rerank:
    enabled: false
