server {
    listen       80;
    server_name  localhost;

    # 前端静态文件根目录（请确保 dist 内容已复制到这里）
    root   /usr/share/nginx/html;

    # 所有 HTML 请求都返回 index.html（解决 Vue Router history 刷新 404）
    location / {
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API 请求反向代理到指定后端（适配前端生产环境使用 /api）
    location ^~ /api/ {
        proxy_pass https://xiaoyu-back-234327-9-1411888491.sh.run.tcloudbase.com/api/;
        proxy_ssl_server_name on;
        proxy_ssl_name xiaoyu-back-234327-9-1411888491.sh.run.tcloudbase.com;

        # 设置请求头
        proxy_set_header Host xiaoyu-back-234327-9-1411888491.sh.run.tcloudbase.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events) 配置：保持长连接 + 禁用缓冲，确保实时流式输出
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header X-Accel-Buffering "no";

        # 增加错误调试信息
        proxy_intercept_errors off;
    }

    # 处理静态资源请求（强缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 处理错误页
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

